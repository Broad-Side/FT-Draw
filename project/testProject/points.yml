schema_version: 4

controllers:
  SNC01:
    template: JCI_SNC25152
    point_template: GenericController.drawio
    drawing_name: SNC01 - UI Connections

layout:
  controller_origin: {x: 40, y: 80}

  # Minimum distance between point starting positions.
  point_pitch_y: 96

  # Clearance below the lowest part of the previous point.
  point_vertical_gap: 8

  terminal_origin_x: 435
  terminal_column_spacing: 210

  field_device_x: 1228

  terminal_block_info:
    X3: 
      label: 24 VDC
      type: single
      color: red
      commons: []
      reversed: false #false, when drawn X3 terminals are drawn on the left hand side, true they are drawn on the left

    X4: 
      label: 24 VDC Common
      type: single
      color: black
      reversed: false
      commons: []

    X5: 
      label: 24 VAC
      type: single
      color: grey
      reversed: false
      commons: []

    X6: 
      label: 24 VAC Common
      type: single
      color: grey
      reversed: false
      commons: []
    
    X7: 
      label: "IO"
      type: double
      color: grey
      reversed: true
      commons: []

    X8: 
      label: "IO"
      type: double
      color: grey
      reversed: true
      commons: [X8-002, X8-005, X8-006] # Common bar added in double or triple stack terminals to make them all the same potential.
    # Below comments for AI to undertand changes and build new terminal drawing. 
    # X8: {type: double, color: grey, commons: [X8-002, X8-005, X8-006]}
    # X8: {type: triple, color: grey, commons: [X8-002, X8-005, X8-006]}
    # X8: {type: fuse, color: black}

    terminal_blocks_order:
      # Closest to controller to furthest away.
      # I have not added this to the above section, but it is easier to visualize the order of the terminal blocks in the drawing if they are listed here.
      X3: {order: 1}  # 24 VDC terminal strip
      X4: {order: 1}  # 24 VDC common terminal strip

      X5: {order: 2}  # 24 VAC terminal strip
      X6: {order: 2}  # 24 VAC common terminal strip

      X7: {order: 3}  # Digital I/O terminal strip
      X8: {order: 3}  # Analog I/O terminal strip

      other: {order: 4}  # MSSB or other terminals

points:
  TT12-OAT:
    controller: SNC01
    equipment: AHU01
    description: Outside Air Temperature

    controller_point:
      point: UI1

    field_device:
      label: TT12-OAT
      interfaces:
        signal:
          order: 1
          label: SIG
        supply:
          order: 2
          label: "+"

    wiring:
      signal:
        from: {point: UI1, interface: signal}
        via: [X8-001B]
        labels: [8-001B, 8-001B]
        to: {field_interface: signal}

      supply:
        from: {terminal: X3-001}
        via: [X8-001A]
        labels: [38-001, 8-001A]
        to: {field_interface: supply}

      common_ground:
        from: {point: UI1, interface: common}
        via: []
        labels: [X8-002]
        to: {terminal: X8-002A}

      common_ground_mk2:
        from: {terminal: X8-002B}
        via: []
        labels: [48-001]
        to: {terminal: X4-001}

  TT13-OAT:
