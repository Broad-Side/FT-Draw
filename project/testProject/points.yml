schema_version: 4

controllers:
  SNC01:
    template: JCI_SNC25152
    point_template: GenericController.drawio
    drawing_name: SNC01 - UI Connections

layout:
  controller_origin: {x: 40, y: 80}

  # Minimum distance between point starting positions.
  point_pitch_y: 96

  # Clearance below the lowest part of the previous point.
  point_vertical_gap: 8

  terminal_origin_x: 435
  terminal_column_spacing: 210

  field_device_x: 1228

  terminal_blocks:
    # Closest to controller to furthest away.

    X3: {order: 1}  # 24 VDC terminal strip
    X4: {order: 1}  # 24 VDC common terminal strip

    X5: {order: 2}  # 24 VAC terminal strip
    X6: {order: 2}  # 24 VAC common terminal strip

    X7: {order: 3}  # Digital I/O terminal strip
    X8: {order: 3}  # Analog I/O terminal strip

    other: {order: 4}  # MSSB or other terminals

points:
  TT12-OAT:
    controller: SNC01
    equipment: AHU04
    description: Outside Air Temperature

    controller_point:
      point: UI1

    field_device:
      label: TT12-OAT

      interfaces:
        signal:
          order: 1
          label: SIG

        supply:
          order: 2
          label: "+"

    wiring:
      signal:
        from: {point: UI1, interface: signal}
        via: [X8-001B]
        labels: [8-001B, 8-001B]
        to: {field_interface: signal}

      common_ground:
        from: {point: UI1, interface: common}
        via: []
        labels: [X8-002]
        to: {terminal: X8-002A}

      supply:
        from: {terminal: X3-001}
        via: [X8-001A]
        labels: [38-001, 8-001A]
        to: {field_interface: supply}