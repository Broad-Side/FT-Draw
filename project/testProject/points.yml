schema_version: 3

controllers:
  SNC01:
    template: JCI_SNC25152
    point_template: GenericController.drawio
    drawing_name: SNC01 - UI Connections

layout:
  controller_origin: {x: 40, y: 80}
  # TBD point_pitch_y: 96

  terminal_origin_x: 435
  terminal_column_spacing: 210

  field_device_x: 1228
  # TBD field_device_pitch_y: 96

  terminal_blocks:
    # Closest to Controler to furtherest Away

    X3: {order: 1} # 24VDC Terminal Strip
    X4: {order: 1} # 24VDC Terminal Strip Neutral 
    
    X5: {order: 2} # 24VAC Terminal Strip
    X6: {order: 2} # 24VAC Terminal Strip Neutral 
    
    X7: {order: 3} # Digital IO Strip
    X8: {order: 3} # Anologue IO Strip
    
    # Use below to show if the point is in an MSSB
    other: {order: 4}

points:
  TT12-OAT:
    controller: SNC01
    equipment: AHU04
    description: Outside Air Temperature
    
    wiring:
      signal:
        to: {point: UI1}
        via: [X8-001B]
        labels: [8-001B, 8-001B]
        fieldside_label: SIG

      common:
        from: {point: UI1, interface: common}
        to: {terminal: X8-002A}
        labels: [X8-002]


      supply:
        to: {terminal: X3-001}
        via: [X8-001A]
        labels: [38-001, 8-001A]
        fieldside_label: +

