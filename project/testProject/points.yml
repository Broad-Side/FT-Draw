schema_version: 4

controllers:
  SNC01:
    template: JCI_SNC25152
    point_template: GenericController.drawio
    drawing_name: SNC01 - UI Connections

layout:
  controller_origin: {x: 40, y: 80}

  # Minimum distance between point starting positions.
  point_pitch_y: 96

  # Clearance below the lowest part of the previous point.
  point_vertical_gap: 8

  terminal_origin_x: 435
  terminal_column_spacing: 210

  field_device_x: 1228

  # Panel wire circuits and their wire colours. Wires take their circuit from
  # the terminal block they touch (circuit: below), else the controller
  # interface role (signal_common -> 0VDC), else SIGNAL. A route can override
  # with circuit: <name>. Field wires in a cable use the core colour.
  # draw: is the line colour on the drawing when it differs from the wire.
  # stripe: (and stripe_draw:) add a second colour, drawn as a striped line.
  wire_circuits:
    24VDC:     {colour: blue, draw: "#00ADEF"}
    0VDC:      {colour: blue, draw: "#00ADEF", stripe: white, stripe_draw: "#FFFFFF"}
    24VAC:     {colour: red, draw: "#E81123"}
    24VAC_COM: {colour: red, draw: "#E81123", stripe: grey, stripe_draw: "#808080"}
    SIGNAL:    {colour: violet, draw: "#B4009E"}
    EARTH:     {colour: green, draw: "#60A917", stripe: yellow , stripe_draw: "#FFFF00"}
    VFC:       {colour: white, draw: "#808080"}

  terminal_block_info:
    X3: 
      label: 24 VDC
      circuit: 24VDC
      type: single
      color: red
      commons: []
      reversed: false #false, when drawn X3 terminals are drawn on the left hand side, true they are drawn on the left

    X4: 
      label: 24 VDC Common
      circuit: 0VDC
      type: single
      color: black
      reversed: false
      commons: []

    X5: 
      label: 24 VAC
      circuit: 24VAC
      type: single
      color: grey
      reversed: false
      commons: []

    X6: 
      label: 24 VAC Common
      circuit: 24VAC_COM
      type: single
      color: grey
      reversed: false
      commons: []
    
    X7: 
      label: "IO"
      type: double
      color: grey
      reversed: true
      commons: []

    X8: 
      label: "IO"
      type: double
      color: grey
      reversed: true
      commons: [X8-002, X8-005, X8-006, X8-010] # Common bar added in double or triple stack terminals to make them all the same potential.
    # Below comments for AI to undertand changes and build new terminal drawing. 
    # X8: {type: double, color: grey, commons: [X8-002, X8-005, X8-006]}
    # X8: {type: triple, color: grey, commons: [X8-002, X8-005, X8-006]}
    # X8: {type: fuse, color: black}

    X0: 
      label: "Earth"
      circuit: EARTH
      type: single
      color: green
      reversed: false
      earth: true
    # Below comments for AI to undertand changes and build new terminal drawing. 
    # X8: {type: double, color: grey, commons: [X8-002, X8-005, X8-006]}
    # X8: {type: triple, color: grey, commons: [X8-002, X8-005, X8-006]}
    # X8: {type: fuse, color: black}

    terminal_blocks_order:
      # Closest to controller to furthest away.
      # I have not added this to the above section, but it is easier to visualize the order of the terminal blocks in the drawing if they are listed here.
      X3: {order: 1}  # 24 VDC terminal strip
      X4: {order: 1}  # 24 VDC common terminal strip

      X5: {order: 2}  # 24 VAC terminal strip
      X6: {order: 2}  # 24 VAC common terminal strip

      X7: {order: 3}  # Digital I/O terminal strip
      X8: {order: 3}  # Analog I/O terminal strip
      X0: {order: 1}  # Earth terminals, in the IO column

      other: {order: 4}  # MSSB or other terminals

points:
  TT12-OAT:
    controller: SNC01
    equipment: AHU01
    description: Outside Air Temperature

    controller_point:
      point: UI1

    field_device:
      label: TT12-OAT
      interfaces:
        signal:
          order: 1
          label: SIG
        supply:
          order: 2
          label: "+"

    wiring:
      signal:
        from: {point: UI1, interface: signal}
        via: [X8-001B]
        labels: [8-001B, 8-001B]
        cable: {tag: CF-8-1, core: 1-white}
        to: {field_interface: signal}

      supply:
        from: {terminal: X3-001}
        via: [X8-001A]
        labels: [38-001, 8-001A]
        cable: {tag: CF-8-1, core: 1-black}
        to: {field_interface: supply}

      common_ground:
        from: {point: UI1, interface: common}
        via: []
        labels: [8-002A]
        to: {terminal: X8-002A}

      common_ground_to_terminal:
        from: {terminal: X8-002B}
        via: []
        labels: [48-001]
        to: {terminal: X4-001}
      
      screen:
        from: {terminal: X0-001}
        via: []
        labels: [0-001]
        cable: {tag: CF-8-1, core: screen}
        to: {cut_back: true}     # new end: screen cut back and insulated at the device

