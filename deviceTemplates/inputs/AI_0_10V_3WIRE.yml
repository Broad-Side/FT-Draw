schema_version: 1

device_template:
  name: AI_0_10V_3WIRE
  description: 0-10 V Three-Wire Active Sensor
  category: sensor

  compatible_point_types:
    - UI

  drawing:
    template: AI_0_10V_3WIRE.drawio
    group_id: AI_0_10V_3WIRE
    label_id: device_label

    interfaces:
      supply:
        drawio_id: supply
        label: +15V
        interface_type: supply
        role: supply_positive
        required: true

      signal:
        drawio_id: signal
        label: OUT
        interface_type: signal
        role: analog_signal
        required: true

      common:
        drawio_id: common
        label: COM
        interface_type: common
        role: signal_common
        required: true

  connections:
    supply:
      device_interface: supply
      controller_interface: supply

    signal:
      device_interface: signal
      controller_interface: signal

    common:
      device_interface: common
      controller_interface: common

  labels:
    display:
      - tag
      - description

  schedule:
    type: Active Sensor
    signal_type: voltage_0_10v
    signal_range:
      minimum_v: 0
      maximum_v: 10
    supply_voltage: 15VDC
    units: engineering_units