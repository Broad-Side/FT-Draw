schema_version: 3

controllers:
  SNC01:
    template: JCI_SNC25152
    point_template: GenericController.drawio
    drawing_name: SNC01 - UI Connections

layout:
  controller_origin: {x: 40, y: 80}
  point_pitch_y: 96
  terminal_origin_x: 520
  terminal_column_spacing: 80
  field_device_x: 1080
  field_device_pitch_y: 110
  terminal_blocks:
    X4: {order: 1}
    X3: {order: 2}
    X2: {order: 3}
    other: {order: 4}

devices:
  OAT01:
    controller: SNC01
    equipment: AHU01
    description: Outside Air Temperature
    template: AI_10K
    wiring:
      signal:
        to: {point: UI1}
        via: [X4-001]
        labels: [4-001D, 4-001A]
      common:
        to: {point: UI1}
        via: [X4-002]
        labels: [4-002C, 4-002B]

  OAT02:
    controller: SNC01
    equipment: AHU02
    description: Outside Air Temperature
    template: AI_10K
    wiring:
      signal:
        to: {point: UI2}
        via: [X4-003]
        labels: [4-003D, 4-003A]
      common:
        to: {point: UI2}
        via: [X4-002]
        labels: [4-002C, 4-002A]

